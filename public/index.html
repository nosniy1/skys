<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Skys</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
                 font-family: -apple-system, Helvetica, Arial, sans-serif; user-select: none; }
    canvas { display: block; }

    #hud { position: fixed; top: 16px; left: 20px; color: white; font-size: 22px;
           font-weight: bold; line-height: 1.5; text-shadow: 0 2px 4px #000; }
    #help { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center;
            color: white; opacity: 0.85; font-size: 15px; text-shadow: 0 1px 3px #000; }
    #message { position: fixed; top: 38%; width: 100%; text-align: center; font-size: 72px;
               color: white; font-weight: 900; text-shadow: 0 4px 12px #000; pointer-events: none; }
    #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                 color: #ffeb3b; font-size: 36px; text-shadow: 0 0 4px #000; pointer-events: none; }
    #flash { position: fixed; inset: 0; background: #ff3300; opacity: 0;
             pointer-events: none; transition: opacity 0.8s; }

    #start { position: fixed; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; text-align: center;
             background: rgba(0, 40, 90, 0.55); color: white; cursor: pointer; }
    #start h1 { font-size: 110px; margin: 0; letter-spacing: 8px; text-shadow: 0 6px 16px #000; }
    #start .go { font-size: 32px; margin: 10px 0 30px; animation: blink 1.2s infinite; }
    #start .keys { font-size: 20px; line-height: 2.1; }
    kbd { background: white; color: #333; border-radius: 6px; padding: 2px 10px;
          font-weight: bold; box-shadow: 0 3px 0 #999; font-family: inherit; }
    @keyframes blink { 50% { opacity: 0.4; } }
  </style>

  <!-- This tells the browser where to find the "three" 3D library -->
  <script type="importmap">
    { "imports": { "three": "/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud"></div>
  <div id="crosshair" hidden>+</div>
  <div id="message"></div>
  <div id="flash"></div>
  <div id="help">
    <kbd>C</kbd> camera &nbsp; <kbd>M</kbd> music &nbsp; <kbd>F</kbd> full screen
  </div>

  <div id="start">
    <h1>✈️ SKYS</h1>
    <div class="go">Click to fly!</div>
    <div class="keys">
      <kbd>W</kbd> climb up &nbsp; <kbd>S</kbd> dive down<br>
      <kbd>A</kbd> turn left &nbsp; <kbd>D</kbd> turn right<br>
      <kbd>Shift</kbd> go faster &nbsp; <kbd>Space</kbd> shoot<br>
      Pop the balloons! Don't hit the buildings!
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
